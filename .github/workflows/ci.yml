name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit tests
        run: mvn -B -ntp test
      - name: Integration tests with disposable PostgreSQL
        run: mvn -B -ntp -Dtest=WalletApiIT test

  docker:
    name: Docker image
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build application image
        run: docker build -t internal-wallet:ci .
