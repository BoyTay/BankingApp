spring.application.name=internal-wallet
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/internal_wallet}
spring.datasource.username=${DB_USER:wallet_app}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.deserialization.fail-on-unknown-properties=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
account.fees.enabled=${ACCOUNT_FEES_ENABLED:false}
account.fees.checking-monthly-dong=${CHECKING_MONTHLY_FEE_DONG:5000}
account.fees.credit-annual-dong=${CREDIT_ANNUAL_FEE_DONG:20000}
account.savings.term-days=${SAVINGS_TERM_DAYS:90}
account.savings.annual-rate-bps=${SAVINGS_ANNUAL_RATE_BPS:400}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
management.health.mail.enabled=false
notify.email.enabled=${NOTIFY_EMAIL_ENABLED:false}
notify.email.from=${NOTIFY_EMAIL_FROM:wallet@internal-wallet.local}
